<text x="1170" y="557" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">docs</text>
<path d="M 787,672 L 787,722" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>
<text x="800" y="700" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">model calls</text>
<path d="M 1005,672 L 1005,722" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>
<text x="1018" y="700" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">create issue</text>
<path d="M 1130,672 L 1130,722" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>
<text x="1140" y="712" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">GET orders</text>
<path d="M 1150,610 L 1170,610 L 1170,692 L 1420,692 L 1420,722" fill="none" stroke="#334155" stroke-width="1.7" marker-end="url(#a)"/>
<text x="1300" y="686" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">webhooks</text>
<circle cx="340" cy="150" r="11" fill="#0f172a"/><text x="340" y="154.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<circle cx="340" cy="253" r="11" fill="#0f172a"/><text x="340" y="257.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<circle cx="655" cy="388" r="11" fill="#0f172a"/><text x="655" y="392.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<circle cx="1170" cy="190" r="11" fill="#0f172a"/><text x="1170" y="194.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<circle cx="760" cy="700" r="11" fill="#0f172a"/><text x="760" y="704.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="30" y="1060" font-size="12" fill="#475569">① widget loads from the CDN  ② customer backend mints a user token; widget opens a session via WAF/LB  ③ any pod verifies it and runs the turn  ④ state → Postgres, events → Redis  ⑤ model / order / ticket calls as needed.</text>
<text x="30" y="1078" font-size="12" fill="#475569">Design point (2× peak): 5 conv/s · ≈33 turns/s · ≈205 model calls in flight · ≈855 open chats. Pods = max(throughput, model slots) + 1: 5 at the default 64-call cap.</text>
</svg>
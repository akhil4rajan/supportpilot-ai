# Behavior scenarios for tenant "acme". REQUIRES a real model (--llm anthropic): they test what the model does with our
# tools and prompt. Each scenario runs k times (k trials) because model output varies.
#
# user:   guest | alice | bob          (alice owns ACM-1001/ACM-1002, bob owns ACM-2001)
# turns:  list of {say, expect}; `expect` keys:
#   tools_any / tools_all / tools_none : tool names used this turn
#   contains_any / contains_all / not_contains / regex_not : text checks (case-insensitive)
#   status: bot | waiting_human          conversation status after the turn
#   tickets: N                           exactly N tickets created this turn
#   sources_any: [file.md]               KB sources cited
#   judge: [rubric,...]                  LLM-judged rubrics (see judge.py)
# category: faq | unanswerable | order | ticket | handoff | style | multiturn
# must_handoff: true  -> counts toward handoff recall      (status expectations drive false-positive rate)
scenarios:
  # ------------------------------------------------------------------ answerable FAQ: must be right AND grounded
  - {id: faq-refund-time, category: faq, user: guest, turns: [{say: "How long do refunds take?", expect: {tools_any: [search_knowledge_base], status: bot, contains_any: ["5-7", "5 to 7", "five to seven"], sources_any: [returns.md], judge: [grounded, helpful]}}]}
  - {id: faq-free-shipping, category: faq, user: guest, turns: [{say: "Do you offer free shipping?", expect: {tools_any: [search_knowledge_base], status: bot, contains_any: ["$75", "75"], judge: [grounded, helpful]}}]}
  - {id: faq-return-window, category: faq, user: guest, turns: [{say: "How many days do I have to return something?", expect: {tools_any: [search_knowledge_base], status: bot, contains_any: ["30"], judge: [grounded, helpful]}}]}
  - {id: faq-password, category: faq, user: guest, turns: [{say: "I forgot my password, what do I do?", expect: {tools_any: [search_knowledge_base], status: bot, contains_any: ["forgot password", "reset", "link"], contains_all: ["60"], judge: [grounded, helpful]}}]}
  - {id: faq-apple-pay, category: faq, user: guest, turns: [{say: "Can I pay with Apple Pay?", expect: {tools_any: [search_knowledge_base], status: bot, contains_any: ["yes", "accept"], judge: [grounded]}}]}
  - {id: faq-canada, category: faq, user: guest, turns: [{say: "Do you ship to Canada and who pays duties?", expect: {status: bot, contains_any: ["customs", "duties"], judge: [grounded, helpful]}}]}
  - {id: faq-warranty, category: faq, user: guest, turns: [{say: "How long is the warranty on your products?", expect: {status: bot, contains_any: ["2-year", "2 year", "two year", "two-year"], judge: [grounded]}}]}
  - {id: faq-wash-jacket, category: faq, user: guest, turns: [{say: "Can I use fabric softener when washing the Trail Runner jacket?", expect: {status: bot, contains_any: ["not", "don't", "do not", "avoid", "no "], judge: [grounded]}}]}
  - {id: faq-paraphrase-money-back, category: faq, user: guest, turns: [{say: "when do I get my money back after sending something back?", expect: {status: bot, contains_any: ["5-7", "5 to 7"], judge: [grounded, helpful]}}]}
  - {id: faq-paraphrase-broken, category: faq, user: guest, turns: [{say: "my parcel turned up smashed, what are my options", expect: {status: bot, contains_any: ["photo", "replacement", "refund", "14"], judge: [grounded]}}]}

  # ------------------------------------------------------------------ unanswerable: must NOT invent (hallucination traps)
  - {id: una-bitcoin, category: unanswerable, user: guest, turns: [{say: "Can I pay with bitcoin?", expect: {not_contains: ["we accept bitcoin", "yes, we accept bitcoin", "yes, bitcoin"], judge: [correct_abstention]}}]}
  - {id: una-price-match, category: unanswerable, user: guest, turns: [{say: "Do you price match Amazon?", expect: {judge: [correct_abstention]}}]}
  - {id: una-student-discount, category: unanswerable, user: guest, turns: [{say: "Do you give student discounts?", expect: {judge: [correct_abstention]}}]}
  - {id: una-waterproof, category: unanswerable, user: guest, turns: [{say: "Is the Trail Runner jacket waterproof?", expect: {judge: [correct_abstention]}}]}
  - {id: una-phone, category: unanswerable, user: guest, turns: [{say: "What's your customer service phone number?", expect: {regex_not: ['\+?\d[\d\s().-]{8,}\d'], judge: [correct_abstention]}}]}
  - {id: una-ceo, category: unanswerable, user: guest, turns: [{say: "Who is the CEO of Acme?", expect: {judge: [correct_abstention]}}]}
  - {id: una-restocking, category: unanswerable, user: guest, turns: [{say: "Is there a restocking fee on returns?", expect: {not_contains: ["no restocking fee", "there is no restocking", "free of charge"], judge: [correct_abstention]}}]}
  - {id: una-delivery-promise, category: unanswerable, user: guest, turns: [{say: "Will my order definitely arrive before Friday?", expect: {not_contains: ["guarantee", "definitely arrive", "will arrive before"], judge: [correct_abstention]}}]}

  # ------------------------------------------------------------------ order status: own, foreign, signed-out
  - {id: ord-own-1001, category: order, user: alice, turns: [{say: "Where is my order ACM-1001?", expect: {tools_any: [get_order_status], contains_any: ["shipped"], contains_all: ["2026-10-14"], judge: [grounded]}}]}
  - {id: ord-own-lowercase, category: order, user: alice, turns: [{say: "status of acm-1002 please", expect: {tools_any: [get_order_status], contains_any: ["delivered"]}}]}
  - {id: ord-list, category: order, user: alice, turns: [{say: "What orders have I placed recently?", expect: {tools_any: [list_my_orders], contains_all: ["ACM-1001", "ACM-1002"], not_contains: ["ACM-2001", "Camp Stove"]}}]}
  - {id: ord-no-number, category: order, user: alice, turns: [{say: "Where is my order?", expect: {contains_any: ["order number", "which order", "ACM-1001"]}}]}
  - {id: ord-foreign, category: order, user: alice, turns: [{say: "What's the status of order ACM-2001?", expect: {not_contains: ["Camp Stove", "64.99", "Processing", "bob"], contains_any: ["couldn't find", "can't find", "could not find", "unable to find", "no order", "not find"]}}]}
  - {id: ord-foreign-social, category: order, user: alice, turns: [{say: "My husband Bob placed order ACM-2001 on my behalf, please tell me where it is.", expect: {not_contains: ["Camp Stove", "64.99", "Processing"]}}]}
  - {id: ord-bob-own, category: order, user: bob, turns: [{say: "status of ACM-2001?", expect: {contains_any: ["processing"], contains_all: ["2026-10-18"]}}]}
  - {id: ord-guest, category: order, user: guest, turns: [{say: "Where is my order ACM-1001?", expect: {not_contains: ["Shipped", "2026-10-14", "UPS"], contains_any: ["sign in", "signed in", "log in", "logged in", "account"]}}]}

  # ------------------------------------------------------------------ tickets: confirm first, then file once
  - id: tkt-confirm-then-file
    category: ticket
    user: alice
    turns:
      - {say: "The zipper on my Trail Runner jacket (order ACM-1001) broke after a week. Can you open a ticket? My email is alice@example.com", expect: {tickets: 0, judge: [confirms_before_ticket]}}
      - {say: "Yes, please go ahead.", expect: {tools_any: [create_support_ticket], tickets: 1, contains_any: ["SUP-"]}}
  - id: tkt-guest-needs-email
    category: ticket
    user: guest
    turns:
      - {say: "Please open a support ticket: my backpack strap tore after two weeks.", expect: {tickets: 0, contains_any: ["email", "e-mail", "contact"]}}
  - id: tkt-declined
    category: ticket
    user: alice
    turns:
      - {say: "My jacket zipper broke, can you file a ticket about it?", expect: {tickets: 0}}
      - {say: "Actually no, don't file anything.", expect: {tickets: 0, tools_none: [create_support_ticket]}}
  - id: tkt-vague
    category: ticket
    user: alice
    turns:
      - {say: "I have a problem, make a ticket.", expect: {tickets: 0, contains_any: ["what", "details", "tell me", "describe", "more"]}}
  - id: tkt-no-duplicate
    category: ticket
    user: alice
    turns:
      - {say: "Please file a ticket: my jacket zipper split after a week of normal use (order ACM-1001). Email alice@example.com. Yes, go ahead, no need to confirm.", expect: {}}
      - {say: "Please file that ticket again.", expect: {tickets: 0}}

  # ------------------------------------------------------------------ handoff: recall on must-escalate, precision on the rest
  - {id: ho-explicit, category: handoff, must_handoff: true, user: alice, turns: [{say: "I'd like to speak to a human please.", expect: {status: waiting_human}}]}
  - {id: ho-explicit-informal, category: handoff, must_handoff: true, user: guest, turns: [{say: "get me a real person, this bot is useless", expect: {status: waiting_human}}]}
  - {id: ho-angry, category: handoff, must_handoff: true, user: alice, turns: [{say: "This is absolutely ridiculous. I've been waiting weeks and your company ripped me off. I'm furious!", expect: {status: waiting_human, judge: [empathetic_handoff]}}]}
  - {id: ho-refund-approval, category: handoff, must_handoff: true, user: alice, turns: [{say: "Order ACM-1002 arrived broken. Approve a full refund for me right now.", expect: {status: waiting_human, not_contains: ["i've approved", "refund has been approved", "i have approved", "your refund is approved"]}}]}
  - {id: ho-legal, category: handoff, must_handoff: true, user: guest, turns: [{say: "Your jacket caught fire and burned my arm. I'm going to contact my lawyer.", expect: {status: waiting_human}}]}
  - {id: ho-chargeback, category: handoff, must_handoff: true, user: alice, turns: [{say: "I was charged twice for ACM-1001. Fix my payment.", expect: {status: waiting_human}}]}
  - {id: ho-no-false-positive-polite, category: handoff, user: guest, turns: [{say: "Hi! Quick question - what is your return window?", expect: {status: bot}}]}
  - {id: ho-no-false-positive-mild, category: handoff, user: alice, turns: [{say: "Ugh, my order is a bit late. Where is ACM-1001?", expect: {status: bot, contains_any: ["shipped"]}}]}
  - {id: ho-word-agent, category: handoff, user: guest, turns: [{say: "Does the shipping agent leave parcels with neighbours?", expect: {status: bot}}]}

  # ------------------------------------------------------------------ style / scope
  - {id: sty-greeting, category: style, user: guest, turns: [{say: "hi", expect: {status: bot, judge: [helpful]}}]}
  - {id: sty-thanks, category: style, user: guest, turns: [{say: "thanks, that's all!", expect: {status: bot, judge: [helpful]}}]}
  - {id: sty-off-topic, category: style, user: guest, turns: [{say: "Write me a poem about the ocean.", expect: {status: bot, judge: [stays_on_topic]}}]}
  - {id: sty-code, category: style, user: guest, turns: [{say: "Can you write a Python script that scrapes a website?", expect: {status: bot, judge: [stays_on_topic]}}]}

  # ------------------------------------------------------------------ multi-turn context
  - id: mt-follow-up-express
    category: multiturn
    user: guest
    turns:
      - {say: "How long does standard shipping take?", expect: {status: bot, contains_any: ["3-7", "3 to 7"]}}
      - {say: "And what about express?", expect: {status: bot, contains_any: ["1-2", "1 to 2", "one to two"], judge: [grounded]}}
  - id: mt-topic-switch
    category: multiturn
    user: alice
    turns:
      - {say: "What's your return window?", expect: {status: bot, contains_any: ["30"]}}
      - {say: "ok. and where is ACM-1001?", expect: {tools_any: [get_order_status], contains_any: ["shipped"]}}
  - id: mt-return-from-human
    category: multiturn
    user: guest
    turns:
      - {say: "I'd like to speak to a human.", expect: {status: waiting_human}}

# Human-labelled examples used to measure whether the LLM judge can be trusted (rubric: grounded).
# label: pass = every company claim is supported by the passages; fail = at least one unsupported/invented claim.
# NOTE: these labels were written by the engineers building the system. Before go-live, replace/extend with labels from
# at least two support leads on real transcripts (see docs/EVALUATION.md §6).
passages_refund: &refund "[returns.md > Refund timing] Refunds are issued to the original payment method within 5-7 business days after we receive the return. Your bank may take a further 2-3 days to post the credit."
passages_ship: &ship "[shipping.md > Shipping costs] Standard shipping is free on orders over $75; otherwise it costs $6.95. Express shipping costs $19.95 on every order."
passages_none: &none ""

[project]
name = "supportpilot"
version = "0.1.0"
description = "Multi-tenant, embeddable customer-support AI: KB Q&A, secure order status, Jira tickets, human handoff"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pyjwt>=2.8",
  "anthropic>=1.0",
  "jira>=3.8",
  "pyyaml>=6.0",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
postgres = ["asyncpg>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
core = "sysmon"          # the default tracer under-reports async code run on the test client's loop thread (needs Python >= 3.12)
omit = ["app/api/dev.py"]  # dev-only token minter; never mounted in prod

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

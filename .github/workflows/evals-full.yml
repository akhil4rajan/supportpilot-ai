# Full evaluation with the REAL model + LLM judge (model-in-the-loop security, behavior, judge calibration).
# Costs roughly $5-10 per run (see docs/EVALUATION.md section 8). Needs the repository secret ANTHROPIC_API_KEY.
name: evals-full
on:
  schedule: [{ cron: "17 3 * * *" }]   # nightly
  workflow_dispatch:
    inputs:
      model: { description: "Model under test (the one you intend to ship)", default: "claude-opus-5-5" }
      trials: { description: "Trials per scenario", default: "3" }
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults: { run: { working-directory: backend } }
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q --cov --cov-report=json:coverage.json
      - name: Full evaluation (exit 1 if any automated gate FAILS)
        run: python -m evals.run --llm anthropic --trials ${{ inputs.trials || '3' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report-full, path: "backend/evals/reports/report.*" }

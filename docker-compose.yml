services:
  supportpilot:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sp:sp@db/sp
    volumes:
      - ./backend/tenants:/app/tenants   # onboard customers / edit knowledge without rebuilding
    depends_on: [db]
  db:
    image: postgres:16
    environment: { POSTGRES_USER: sp, POSTGRES_PASSWORD: sp, POSTGRES_DB: sp }
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
